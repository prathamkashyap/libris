name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Check formatting
        run: mvn spotless:check
        working-directory: backend

      - name: Build and test
        run: mvn clean verify
        working-directory: backend

  phase5:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No dependency install: the Phase 5 suites are stdlib-only and import
      # scripts/dev-seed/phase5_forecasting.py directly, so this job needs
      # neither a database nor any third-party package.
      - name: Run Phase 5 demand forecasting tests
        run: python -m unittest discover -s scripts/dev-seed -p "test_phase5*.py"
