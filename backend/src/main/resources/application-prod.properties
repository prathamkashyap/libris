# Production profile — applied with SPRING_PROFILES_ACTIVE=prod.
#
# This file restates the production security invariants explicitly instead of
# relying on them being inherited, so an accidental change to
# application.properties cannot silently weaken a deployment. Activate it on
# every production instance.

# --- Secrets must come from the environment -------------------------------
# No fallback value here: if LMS_ADMIN_PASSWORD is unset the context fails to
# start rather than booting with a known password.
lms.admin.username=${LMS_ADMIN_USERNAME:admin}
lms.admin.password=${LMS_ADMIN_PASSWORD}

# --- Datasource ------------------------------------------------------------
# The base configuration resolves the URL through a fallback chain that also
# accepts MYSQL_URL / MYSQL_PRIVATE_URL. Those are platform-injected
# connection strings of the form mysql://user:pass@host:port/db, which are
# NOT JDBC URLs. Restating the datasource here, with no fallback, means a
# production instance can never silently consume one: if LMS_DB_URL is
# missing the context fails to start with an unresolved-placeholder error that
# names the variable, instead of failing later inside the connection pool with
# an opaque "url should start with jdbc" message.
#
# docker-compose supplies LMS_DB_URL on the OCI path. The username default is
# the least-privilege application account created by the mysql image, never
# root: the base configuration defaults to root and production must not.
spring.datasource.url=${LMS_DB_URL}
spring.datasource.username=${LMS_DB_USERNAME:libris}
spring.datasource.password=${LMS_DB_PASSWORD}

# --- Transport and session hardening --------------------------------------
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# --- Schema is owned by Flyway, never by Hibernate -------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate is deliberately FALSE in production.
#
# With it enabled, Flyway finds a non-empty schema that has no
# flyway_schema_history table, records the current state as V1, and then
# applies only migrations newer than V1. A database restored from anywhere
# that did not include flyway_schema_history would therefore be left at V1
# with V2 (student_profiles.email unique index), V3 (borrow_records.due_date),
# V4 (books.category) and V5 (borrow_records indexes) never applied — and the
# application would start and appear healthy while the schema was incomplete.
# A silent partial migration is the worst possible outcome here.
#
# With it disabled the three cases are:
#   * Fresh empty database (first boot, or `docker compose down -v`): the
#     schema is empty, so there is nothing to baseline. Flyway applies V1 to
#     V5 in order. This path is unaffected by the setting.
#   * Restore of a Libris backup: scripts/backup-mysql.sh dumps the whole
#     database including flyway_schema_history, so Flyway validates the
#     recorded checksums and skips what is already applied.
#   * Populated schema with no Flyway history (unexpected): Flyway refuses to
#     start and reports the situation. This is intentional. Investigate the
#     database, then adopt it deliberately with
#     `docker compose exec app ...` and Flyway's `baseline`/`baselineOnMigrate`
#     set for that one run. See docs/DEPLOYMENT.md, "Flyway migration
#     behaviour", before doing so.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# --- API surface ----------------------------------------------------------
# Swagger UI and the OpenAPI document are not published in production.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- Management endpoints -------------------------------------------------
# Only the health probe is exposed. /actuator/metrics and /actuator/info are
# reachable without authentication (SecurityConfig permits /actuator/**), so
# they are removed from the production surface. Health details stay hidden and
# the endpoint still returns 503 when a component is DOWN, which is what
# Docker and OCI load balancers probe on.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
