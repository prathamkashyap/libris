# Docker profile — defaults to container named "mysql", or environment URL if provided
spring.datasource.url=${LMS_DB_URL:${MYSQL_URL:${MYSQL_PRIVATE_URL:jdbc:mysql://${MYSQLHOST:mysql}:${MYSQLPORT:3306}/${MYSQLDATABASE:librarydb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC}}}
spring.datasource.username=${LMS_DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${LMS_DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD}}}
