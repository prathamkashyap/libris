<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Libris</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:var(--canvas);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <main class="card login-card" style="width:100%;max-width:420px;margin:0 auto;padding:32px">
    <div style="text-align:center;margin-bottom:32px">
      <svg class="mark" viewBox="0 0 32 32" fill="none" style="width:48px;height:48px;color:var(--indigo);margin-bottom:16px" aria-hidden="true">
        <path d="M6 5h9a5 5 0 0 1 5 5v17H11a5 5 0 0 1-5-5V5Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M20 10h6v17h-6" stroke="currentColor" stroke-width="1.5"/><path d="M9 12h7M9 16h7M9 20h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h1 class="serif" style="font-size:28px;margin:0 0 8px">Welcome to Libris</h1>
      <p class="muted" style="font-size:15px;margin:0">Library management, in one place.</p>
    </div>
    <p id="login-error" class="form-error" role="alert" hidden></p>
    <form id="login-form" novalidate style="display:flex;flex-direction:column;gap:20px">
      <label class="field" style="display:flex;flex-direction:column;gap:6px"><span>Username / Student ID</span><input id="login-username" name="username" required autocomplete="username"></label>
      <label class="field" style="display:flex;flex-direction:column;gap:6px"><span>Password</span><input id="login-password" name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn-primary full" type="submit">Sign In</button>
    </form>
    <p class="muted" style="margin:24px 0 0;font-size:13.5px;text-align:center">Student accounts are created by your librarian. Librarian accounts are managed by an administrator.</p>
  </main>
  <script type="module">
    import { authApi } from "/js/api/auth-api.js";

    const form = document.getElementById("login-form");
    const error = document.getElementById("login-error");
    authApi.csrf().catch(() => {});
    form.addEventListener("submit", async event => {
      event.preventDefault();
      error.hidden = true;
      const data = new FormData(form);
      const username = String(data.get("username") || "").trim();
      const password = String(data.get("password") || "");
      if (!username || !password) {
        error.textContent = "Enter your username and password.";
        error.hidden = false;
        return;
      }
      const submit = form.querySelector("button[type=submit]");
      submit.disabled = true;
      try {
        await authApi.csrf();
        await authApi.login({ username, password });
        window.location.replace("/");
      } catch (err) {
        error.textContent = err.message || "We could not sign you in. Check your credentials and try again.";
        error.hidden = false;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
