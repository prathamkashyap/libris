<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circulation — Libris</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>(function(){var t=localStorage.getItem('theme');if(t==='verdigris')document.documentElement.setAttribute('data-theme','verdigris')})();</script>
  <style>html{visibility:hidden;opacity:0;}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
  <script>document.documentElement.style.visibility='visible';document.documentElement.style.opacity='1';</script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a><nav class="rail" id="rail"></nav>
  <main class="canvas" id="main-content"><div class="shell-page"><div id="topbar-root"></div>
    <header class="page-head"><p class="eyebrow">Circulation</p><div class="page-title-row"><div><h1 class="serif">Borrow records</h1><p class="page-sub">Issue items, process returns, and follow active circulation.</p></div><button class="btn-primary" id="issueItemBtn" type="button">Issue item</button></div></header>
    <div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="sr-only">Search borrow records</span><input type="search" placeholder="Search by student or item title"></label></div>
    <section class="collection-panel" aria-label="Borrow records">
      <div class="table-container">
        <table class="data-table" id="circulationTable">
          <thead>
            <tr>
              <th>Item</th>
              <th>Type</th>
              <th>Student</th>
              <th>Issue Date</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody class="timeline" aria-live="polite">
            <tr><td colspan="7"><div class="loading-state">Loading borrow records…</div></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div></main>
  <div id="palette-root"></div><div id="modal-root"></div><script type="module" src="/js/app-init.js"></script><script type="module" src="/js/borrow.js"></script>
</body>
</html>
