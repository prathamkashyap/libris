<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books — Libris</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a><nav class="rail" id="rail"></nav>
  <main class="canvas" id="main-content"><div class="shell-page"><div id="topbar-root"></div>
    <header class="page-head"><p class="eyebrow">Collection</p><div class="page-title-row"><div><h1 class="serif">Books</h1><p class="page-sub">Search, add, update, and review the live catalog.</p></div><a class="btn-primary" href="#booksGrid" id="addBookBtn" hidden>Add book</a></div></header>
    <div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><span class="sr-only">Search books</span><input type="search" placeholder="Search by title, author, or ISBN"></label><div class="filter-row"><div class="view-toggle" aria-label="View options"><button id="viewGrid" class="active" type="button" aria-label="Grid view"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button><button id="viewList" type="button" aria-label="Table view"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div></div></div>
    <section class="book-cards-grid" id="booksGrid" aria-live="polite"><div class="loading-state">Loading the catalog…</div></section>
    <section class="card table-card" id="booksList" hidden><table><thead><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody><tr><td colspan="5">Loading the catalog…</td></tr></tbody></table><div class="table-foot"><span class="muted">Loading results…</span><div class="pager"></div></div></section>
  </div></main>
  <div id="palette-root"></div><div id="modal-root"></div><script type="module" src="/js/app-init.js"></script><script type="module" src="/js/books.js"></script>
</body>
</html>
