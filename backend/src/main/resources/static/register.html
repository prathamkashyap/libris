<!DOCTYPE html>
<html lang="en">
  <head>
  <script>
    (function(){
      var t=localStorage.getItem('theme');
      if(t==='bloom'||t==='slate')document.documentElement.setAttribute('data-theme',t);
    })();
  </script>
  <style>
    html{transition:background-color .3s ease,color .3s ease}
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Access — Libris</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:var(--canvas);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
<div class="petal-decor" aria-hidden="true"></div>
<div class="star-decor" aria-hidden="true"></div>
  <main class="card login-card" style="width:100%;max-width:420px;margin:0 auto;padding:32px;text-align:center">
    <h1 class="serif" style="font-size:28px;margin:0 0 12px">Accounts are administrator-managed</h1>
    <p class="muted" style="margin:0 0 24px">Ask a library administrator to create your account, then sign in with the credentials they provide.</p>
    <a class="btn-primary full" href="/login.html">Go to sign in</a>
  </main>
</body>
</html>
