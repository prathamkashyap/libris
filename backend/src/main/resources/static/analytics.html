<!DOCTYPE html>
<html lang="en">
<head>
<style>
  html{transition:background-color .3s ease,color .3s ease}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — Libris</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,480;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="petal-decor" aria-hidden="true"></div>
<div class="star-decor" aria-hidden="true"></div>

<nav class="rail" id="rail"></nav>

<main class="canvas single" id="main-content">
  <div class="shell-page">
    <div id="topbar-root"></div>
    
<header class="page-head">
  <div class="eyebrow">Intelligence</div>
  <h1 class="serif">Analytics</h1>
  <p class="page-sub">How the collection is actually being read.</p>
</header>

<div class="stat-grid stat-grid-4">
  <div class="stat-card"><span class="stat-label">Avg. borrow duration</span><span class="stat-value" id="stat-duration">&mdash;</span></div>
  <div class="stat-card"><span class="stat-label">Renewal rate</span><span class="stat-value" id="stat-renewal">&mdash;</span></div>
  <div class="stat-card"><span class="stat-label">Peak hour</span><span class="stat-value" id="stat-peak">&mdash;</span></div>
  <div class="stat-card"><span class="stat-label">Fill rate</span><span class="stat-value" id="stat-fill">&mdash;</span></div>
</div>

<!-- Row 1: Issued vs Returned (8 cols) + Usage by Department (4 cols) -->
<div class="bento">
  <div class="card span-8">
    <div class="card-head"><h3>Issued vs. returned</h3></div>
    <div class="chart-area" id="chart-issued-returned">
      <svg class="area-chart" viewBox="0 0 640 220" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="grad-issued" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--indigo)" stop-opacity=".3"/>
            <stop offset="100%" stop-color="var(--indigo)" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="grad-returned" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4ADE80" stop-opacity=".2"/>
            <stop offset="100%" stop-color="#4ADE80" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <!-- Grid lines -->
        <g class="chart-grid" stroke="rgba(255,255,255,.06)" stroke-width="1">
          <line x1="40" y1="20" x2="620" y2="20"/>
          <line x1="40" y1="65" x2="620" y2="65"/>
          <line x1="40" y1="110" x2="620" y2="110"/>
          <line x1="40" y1="155" x2="620" y2="155"/>
          <line x1="40" y1="200" x2="620" y2="200"/>
        </g>
        <!-- Y-axis labels -->
        <g class="axis-labels" fill="rgba(155,150,181,.5)" font-size="10" font-family="Inter, sans-serif">
          <text x="32" y="24" text-anchor="end">5</text>
          <text x="32" y="69" text-anchor="end">4</text>
          <text x="32" y="114" text-anchor="end">3</text>
          <text x="32" y="159" text-anchor="end">2</text>
          <text x="32" y="204" text-anchor="end">1</text>
        </g>
        <!-- Issued area -->
        <path id="issued-area" d="" fill="url(#grad-issued)"/>
        <!-- Issued line -->
        <polyline id="issued-line" points="" fill="none" stroke="var(--indigo)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Returned area -->
        <path id="returned-area" d="" fill="url(#grad-returned)"/>
        <!-- Returned line -->
        <polyline id="returned-line" points="" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4"/>
        <!-- X-axis labels -->
        <g id="issued-x-labels" class="axis-labels" fill="rgba(155,150,181,.5)" font-size="10" font-family="Inter, sans-serif"></g>
        <!-- Dots for hover -->
        <g id="issued-dots"></g>
      </svg>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:var(--indigo)"></span>Issued</span>
        <span class="legend-item"><span class="legend-dot" style="background:#4ADE80"></span>Returned</span>
      </div>
    </div>
  </div>

  <div class="card span-4">
    <div class="card-head"><h3>Usage by department</h3></div>
    <div class="chart-dept" id="chart-department">
      <!-- Horizontal bar chart rendered by JS -->
    </div>
  </div>
</div>

<!-- Row 2: Borrows by hour (full width) -->
<div class="bento">
  <div class="card span-12">
    <div class="card-head"><h3>Borrows by hour</h3></div>
    <div class="chart-hour" id="chart-hourly">
      <div class="bar-chart" id="hourly-bars"></div>
      <div class="axis-row" id="hourly-labels"></div>
    </div>
  </div>
</div>

<!-- Row 3: Top readers + Most borrowed -->
<div class="bento">
  <div class="card span-6">
    <div class="card-head"><h3>Top readers</h3></div>
    <ol class="rank-list" id="top-readers">
      <li class="rank-empty">Loading&hellip;</li>
    </ol>
  </div>
  <div class="card span-6">
    <div class="card-head"><h3>Most borrowed</h3></div>
    <ol class="rank-list" id="top-books">
      <li class="rank-empty">Loading&hellip;</li>
    </ol>
  </div>
</div>

  </div>
</main>

<div id="palette-root"></div>
<script type="module" src="/js/app-init.js"></script>
<script type="module" src="js/analytics.js"></script>

</body>
</html>
