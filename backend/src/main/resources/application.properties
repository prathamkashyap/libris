spring.application.name=library-management-system
spring.datasource.url=${LMS_DB_URL:${MYSQL_URL:${MYSQL_PRIVATE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:librarydb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC}}}
spring.datasource.username=${LMS_DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${LMS_DB_PASSWORD:${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:}}}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
server.port=${PORT:8080}
server.error.include-message=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Caching
spring.cache.type=simple

lms.admin.username=admin
lms.admin.password=${LMS_ADMIN_PASSWORD:ChangeMe123!}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.custom-css=/css/swagger-theme.css

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=WARN

