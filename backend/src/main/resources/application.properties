spring.application.name=library-management-system
spring.datasource.url=${LMS_DB_URL:jdbc:mysql://localhost:3306/librarydb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${LMS_DB_USERNAME:root}
spring.datasource.password=${LMS_DB_PASSWORD:#9RRY9LQC}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
